[package]
name = "oaclaude-usage"
version = "0.0.1"
edition = "2021"

[dependencies]
openaction = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time"] }
log = "0.4"
simplelog = "0.12"
base64 = "0.22"
dirs = "5"
chrono = "0.4"
